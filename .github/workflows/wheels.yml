name: Native wheel smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native wheel
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel
      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Run installed CLI smoke check
        run: dfo benchmark --suite smoke --workers 1
